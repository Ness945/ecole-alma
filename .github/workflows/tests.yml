name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    name: Tests unitaires et syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check

  browser:
    name: Parcours navigateur (Chromium)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Playwright n'est utilisé que pour les tests ; l'application n'a aucune dépendance.
      - name: Installer Playwright et Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          echo "PW_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Démarrer le serveur
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - name: Parcours navigateur
        run: |
          export PLAYWRIGHT_EXECUTABLE="$(node -e "console.log(require(process.env.PW_MODULE).chromium.executablePath())")"
          for f in browser bridge-browser rpg-browser content-browser market-browser discovery-browser pages-browser story-browser room-browser tablet-browser extras-browser castle-browser followup-browser sync-browser words-browser explain-browser evaluation-browser; do
            echo "== tests/$f.mjs"
            node "tests/$f.mjs" "$PW_MODULE"
          done
